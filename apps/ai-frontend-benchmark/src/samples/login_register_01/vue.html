<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md mx-auto">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="flex border-b">
                <button
                    v-for="tab in tabs"
                    :key="tab.id"
                    @click="activeTab = tab.id"
                    :class="['flex-1 py-4 px-4 font-medium text-sm transition-colors focus:outline-none', activeTab === tab.id ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700']">
                    {{ tab.label }}
                </button>
            </div>
            <div class="p-6">
                <!-- Toast -->
                <div v-if="toast.message"
                    :class="['mb-4 p-3 rounded-lg text-sm flex justify-between items-center', toast.type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200']">
                    <span>{{ toast.message }}</span>
                    <button @click="toast.message = ''" class="ml-2 text-current opacity-60 hover:opacity-100">&times;</button>
                </div>

                <!-- Login Form -->
                <form v-if="activeTab === 'login'" @submit.prevent="handleLogin" data-testid="login-form">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" v-model="loginForm.email" :disabled="loading"
                            :class="['w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500', loginErrors.email ? 'border-red-500' : 'border-gray-300']" />
                        <p v-if="loginErrors.email" class="mt-1 text-sm text-red-600 error">{{ loginErrors.email }}</p>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" v-model="loginForm.password" :disabled="loading"
                            :class="['w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500', loginErrors.password ? 'border-red-500' : 'border-gray-300']" />
                        <p v-if="loginErrors.password" class="mt-1 text-sm text-red-600 error">{{ loginErrors.password }}</p>
                    </div>
                    <button type="submit" :disabled="loading"
                        class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 font-medium">
                        {{ loading ? 'Logging in...' : 'Login' }}
                    </button>
                    <p class="mt-4 text-center text-sm text-gray-500">
                        <a href="#" class="text-blue-600 hover:underline">Forgot password?</a>
                    </p>
                    <p class="mt-2 text-center text-sm text-gray-500">
                        Don't have an account?
                        <button type="button" @click="activeTab = 'register'" class="text-blue-600 hover:underline">Register</button>
                    </p>
                </form>

                <!-- Register Form -->
                <form v-if="activeTab === 'register'" @submit.prevent="handleRegister" data-testid="register-form">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" v-model="registerForm.username" :disabled="loading"
                            :class="['w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500', registerErrors.username ? 'border-red-500' : 'border-gray-300']" />
                        <p v-if="registerErrors.username" class="mt-1 text-sm text-red-600 error">{{ registerErrors.username }}</p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" v-model="registerForm.email" :disabled="loading"
                            :class="['w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500', registerErrors.email ? 'border-red-500' : 'border-gray-300']" />
                        <p v-if="registerErrors.email" class="mt-1 text-sm text-red-600 error">{{ registerErrors.email }}</p>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" v-model="registerForm.password" :disabled="loading"
                            :class="['w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500', registerErrors.password ? 'border-red-500' : 'border-gray-300']" />
                        <p v-if="registerErrors.password" class="mt-1 text-sm text-red-600 error">{{ registerErrors.password }}</p>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                        <input type="password" v-model="registerForm.confirmPassword" :disabled="loading"
                            :class="['w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500', registerErrors.confirmPassword ? 'border-red-500' : 'border-gray-300']" />
                        <p v-if="registerErrors.confirmPassword" class="mt-1 text-sm text-red-600 error">{{ registerErrors.confirmPassword }}</p>
                    </div>
                    <button type="submit" :disabled="loading"
                        class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 font-medium">
                        {{ loading ? 'Creating account...' : 'Register' }}
                    </button>
                    <p class="mt-4 text-center text-sm text-gray-500">
                        Already have an account?
                        <button type="button" @click="activeTab = 'login'" class="text-blue-600 hover:underline">Login</button>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
    const { createApp, ref, reactive } = Vue;

    createApp({
        setup() {
            const activeTab = ref('login');
            const loading = ref(false);
            const toast = reactive({ message: '', type: '' });
            const tabs = [
                { id: 'login', label: 'Login' },
                { id: 'register', label: 'Register' },
            ];

            const loginForm = reactive({ email: '', password: '' });
            const loginErrors = reactive({ email: '', password: '' });
            const registerForm = reactive({ username: '', email: '', password: '', confirmPassword: '' });
            const registerErrors = reactive({ username: '', email: '', password: '', confirmPassword: '' });

            function validateLogin() {
                let valid = true;
                loginErrors.email = '';
                loginErrors.password = '';
                if (!loginForm.email.trim()) { loginErrors.email = 'Email is required'; valid = false; }
                else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(loginForm.email)) { loginErrors.email = 'Invalid email format'; valid = false; }
                if (!loginForm.password) { loginErrors.password = 'Password is required'; valid = false; }
                else if (loginForm.password.length < 8) { loginErrors.password = 'Password must be at least 8 characters'; valid = false; }
                return valid;
            }

            function validateRegister() {
                let valid = true;
                registerErrors.username = '';
                registerErrors.email = '';
                registerErrors.password = '';
                registerErrors.confirmPassword = '';
                if (!registerForm.username.trim()) { registerErrors.username = 'Username is required'; valid = false; }
                if (!registerForm.email.trim()) { registerErrors.email = 'Email is required'; valid = false; }
                else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(registerForm.email)) { registerErrors.email = 'Invalid email format'; valid = false; }
                if (!registerForm.password) { registerErrors.password = 'Password is required'; valid = false; }
                else if (registerForm.password.length < 8) { registerErrors.password = 'Password must be at least 8 characters'; valid = false; }
                if (!registerForm.confirmPassword) { registerErrors.confirmPassword = 'Please confirm password'; valid = false; }
                else if (registerForm.password !== registerForm.confirmPassword) { registerErrors.confirmPassword = 'Passwords do not match'; valid = false; }
                return valid;
            }

            async function handleLogin() {
                if (!validateLogin()) return;
                loading.value = true;
                try {
                    await new Promise(r => setTimeout(r, 1500));
                    toast.message = 'Login successful!';
                    toast.type = 'success';
                    loginForm.email = '';
                    loginForm.password = '';
                } catch {
                    toast.message = 'Login failed. Please try again.';
                    toast.type = 'error';
                } finally {
                    loading.value = false;
                }
            }

            async function handleRegister() {
                if (!validateRegister()) return;
                loading.value = true;
                try {
                    await new Promise(r => setTimeout(r, 1500));
                    toast.message = 'Registration successful!';
                    toast.type = 'success';
                    registerForm.username = '';
                    registerForm.email = '';
                    registerForm.password = '';
                    registerForm.confirmPassword = '';
                } catch {
                    toast.message = 'Registration failed. Please try again.';
                    toast.type = 'error';
                } finally {
                    loading.value = false;
                }
            }

            return {
                activeTab, loading, toast, tabs,
                loginForm, loginErrors,
                registerForm, registerErrors,
                handleLogin, handleRegister,
            };
        },
    }).mount('#app');
    </script>
</body>
</html>
