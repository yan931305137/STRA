<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md mx-auto"></div>

    <script>
    // === MINIMAL STR RUNTIME ===
    const STR = (function() {
        const signals = new Map();
        const listeners = new Map();

        function createTree(schema) {
            const tree = { nodes: {}, root: schema.id };
            function addNode(node, parentId) {
                tree.nodes[node.id] = { ...node, children: node.children?.map(c => c.id) || [] };
                if (parentId && tree.nodes[parentId]) {
                    tree.nodes[parentId].children.push(node.id);
                }
                node.children?.forEach(c => addNode(c, node.id));
            }
            addNode(schema, null);
            return tree;
        }

        function dispatchAction(tree, action) {
            const node = tree.nodes[action.targetId];
            if (!node) return;
            if (action.type === 'SET_VALUE') {
                node.props = { ...node.props, ...action.payload };
            } else if (action.type === 'SET_PROP') {
                node.props = { ...node.props, [action.payload.key]: action.payload.value };
            }
            // Emit signals
            const key = action.targetId + '.' + action.type;
            (listeners.get(key) || []).forEach(cb => cb({ type: action.type, targetId: action.targetId, payload: action.payload }));
            (listeners.get('*') || []).forEach(cb => cb({ type: action.type, targetId: action.targetId, payload: action.payload }));
        }

        function subscribeSignal(tree, nodeId, callback, actionType) {
            const key = actionType === '*' ? '*' : nodeId + '.' + actionType;
            if (!listeners.has(key)) listeners.set(key, []);
            listeners.get(key).push(callback);
        }

        function getSnapshot(tree) {
            return JSON.parse(JSON.stringify(tree));
        }

        return { createTree, dispatchAction, subscribeSignal, getSnapshot };
    })();

    // === SEMANTIC TREE DEFINITION ===
    const tree = STR.createTree({
        id: 'auth-page',
        role: 'page',
        intent: 'user-authentication',
        props: {
            activeTab: 'login',
            loading: false,
            toast: { message: '', type: '' },
        },
        children: [
            {
                id: 'auth-card',
                role: 'container',
                intent: 'card-layout',
                props: {},
                children: [
                    {
                        id: 'tab-switcher',
                        role: 'controller',
                        intent: 'tab-navigation',
                        props: { tabs: ['login', 'register'] },
                    },
                    {
                        id: 'login-form',
                        role: 'form',
                        intent: 'user-login',
                        props: { email: '', password: '', errors: {} },
                    },
                    {
                        id: 'register-form',
                        role: 'form',
                        intent: 'user-registration',
                        props: { username: '', email: '', password: '', confirmPassword: '', errors: {} },
                    },
                ],
            },
        ],
    });

    // === ACTION HANDLERS ===
    function validateLogin(values) {
        const errors = {};
        if (!values.email.trim()) errors.email = 'Email is required';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) errors.email = 'Invalid email format';
        if (!values.password) errors.password = 'Password is required';
        else if (values.password.length < 8) errors.password = 'Password must be at least 8 characters';
        return errors;
    }

    function validateRegister(values) {
        const errors = {};
        if (!values.username.trim()) errors.username = 'Username is required';
        if (!values.email.trim()) errors.email = 'Email is required';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) errors.email = 'Invalid email format';
        if (!values.password) errors.password = 'Password is required';
        else if (values.password.length < 8) errors.password = 'Password must be at least 8 characters';
        if (!values.confirmPassword) errors.confirmPassword = 'Please confirm password';
        else if (values.password !== values.confirmPassword) errors.confirmPassword = 'Passwords do not match';
        return errors;
    }

    function switchTab(tab) {
        STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'activeTab', value: tab } });
        STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'login-form', payload: { key: 'errors', value: {} } });
        STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'register-form', payload: { key: 'errors', value: {} } });
        render();
    }

    async function handleLogin() {
        const snap = STR.getSnapshot(tree);
        const formValues = snap.nodes['login-form'].props;
        const errors = validateLogin(formValues);

        if (Object.keys(errors).length > 0) {
            STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'login-form', payload: { key: 'errors', value: errors } });
            render();
            return;
        }

        STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'loading', value: true } });
        render();

        try {
            await new Promise(r => setTimeout(r, 1500));
            STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'toast', value: { message: 'Login successful!', type: 'success' } } });
            STR.dispatchAction(tree, { type: 'SET_VALUE', targetId: 'login-form', payload: { email: '', password: '', errors: {} } });
        } catch {
            STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'toast', value: { message: 'Login failed.', type: 'error' } } });
        } finally {
            STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'loading', value: false } });
            render();
        }
    }

    async function handleRegister() {
        const snap = STR.getSnapshot(tree);
        const formValues = snap.nodes['register-form'].props;
        const errors = validateRegister(formValues);

        if (Object.keys(errors).length > 0) {
            STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'register-form', payload: { key: 'errors', value: errors } });
            render();
            return;
        }

        STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'loading', value: true } });
        render();

        try {
            await new Promise(r => setTimeout(r, 1500));
            STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'toast', value: { message: 'Registration successful!', type: 'success' } } });
            STR.dispatchAction(tree, { type: 'SET_VALUE', targetId: 'register-form', payload: { username: '', email: '', password: '', confirmPassword: '', errors: {} } });
        } catch {
            STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'toast', value: { message: 'Registration failed.', type: 'error' } } });
        } finally {
            STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'loading', value: false } });
            render();
        }
    }

    // === RENDERER (Pure Function of Tree Snapshot) ===
    function render() {
        const snap = STR.getSnapshot(tree);
        const appRoot = document.getElementById('app');
        const { activeTab, loading, toast } = snap.nodes['auth-page'].props;
        const loginForm = snap.nodes['login-form'].props;
        const registerForm = snap.nodes['register-form'].props;

        let html = '<div class="bg-white rounded-xl shadow-lg overflow-hidden">';

        // Tabs
        html += '<div class="flex border-b">';
        html += `<button onclick="switchTab('login')" class="flex-1 py-4 px-4 font-medium text-sm transition-colors focus:outline-none ${activeTab === 'login' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'}">Login</button>`;
        html += `<button onclick="switchTab('register')" class="flex-1 py-4 px-4 font-medium text-sm transition-colors focus:outline-none ${activeTab === 'register' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'}">Register</button>`;
        html += '</div>';

        html += '<div class="p-6">';

        // Toast
        if (toast.message) {
            html += `<div class="mb-4 p-3 rounded-lg text-sm flex justify-between items-center ${toast.type === 'success' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}">`;
            html += `<span>${toast.message}</span>`;
            html += `<button onclick="STR.dispatchAction(tree,{type:'SET_PROP',targetId:'auth-page',payload:{key:'toast',value:{message:'',type:''}}});render();" class="ml-2 text-current opacity-60 hover:opacity-100">&times;</button>`;
            html += '</div>';
        }

        if (activeTab === 'login') {
            html += '<form onsubmit="event.preventDefault();handleLogin();" data-testid="login-form">';
            html += `<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">Email</label>`;
            html += `<input type="email" value="${loginForm.email}" oninput="STR.dispatchAction(tree,{type:'SET_PROP',targetId:'login-form',payload:{key:'email',value:this.value}});render();" ${loading ? 'disabled' : ''} class="w-full px-3 py-2 border ${loginForm.errors?.email ? 'border-red-500' : 'border-gray-300'} rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />`;
            if (loginForm.errors?.email) html += `<p class="mt-1 text-sm text-red-600 error">${loginForm.errors.email}</p>`;
            html += '</div>';
            html += `<div class="mb-6"><label class="block text-sm font-medium text-gray-700 mb-1">Password</label>`;
            html += `<input type="password" value="${loginForm.password}" oninput="STR.dispatchAction(tree,{type:'SET_PROP',targetId:'login-form',payload:{key:'password',value:this.value}});render();" ${loading ? 'disabled' : ''} class="w-full px-3 py-2 border ${loginForm.errors?.password ? 'border-red-500' : 'border-gray-300'} rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />`;
            if (loginForm.errors?.password) html += `<p class="mt-1 text-sm text-red-600 error">${loginForm.errors.password}</p>`;
            html += '</div>';
            html += `<button type="submit" ${loading ? 'disabled' : ''} class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 font-medium">${loading ? 'Logging in...' : 'Login'}</button>`;
            html += '<p class="mt-4 text-center text-sm text-gray-500"><a href="#" class="text-blue-600 hover:underline">Forgot password?</a></p>';
            html += '<p class="mt-2 text-center text-sm text-gray-500">Don\'t have an account? <button type="button" onclick="switchTab(\'register\')" class="text-blue-600 hover:underline">Register</button></p>';
            html += '</form>';
        } else {
            html += '<form onsubmit="event.preventDefault();handleRegister();" data-testid="register-form">';
            html += `<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">Username</label>`;
            html += `<input type="text" value="${registerForm.username}" oninput="STR.dispatchAction(tree,{type:'SET_PROP',targetId:'register-form',payload:{key:'username',value:this.value}});render();" ${loading ? 'disabled' : ''} class="w-full px-3 py-2 border ${registerForm.errors?.username ? 'border-red-500' : 'border-gray-300'} rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />`;
            if (registerForm.errors?.username) html += `<p class="mt-1 text-sm text-red-600 error">${registerForm.errors.username}</p>`;
            html += '</div>';
            html += `<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">Email</label>`;
            html += `<input type="email" value="${registerForm.email}" oninput="STR.dispatchAction(tree,{type:'SET_PROP',targetId:'register-form',payload:{key:'email',value:this.value}});render();" ${loading ? 'disabled' : ''} class="w-full px-3 py-2 border ${registerForm.errors?.email ? 'border-red-500' : 'border-gray-300'} rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />`;
            if (registerForm.errors?.email) html += `<p class="mt-1 text-sm text-red-600 error">${registerForm.errors.email}</p>`;
            html += '</div>';
            html += `<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">Password</label>`;
            html += `<input type="password" value="${registerForm.password}" oninput="STR.dispatchAction(tree,{type:'SET_PROP',targetId:'register-form',payload:{key:'password',value:this.value}});render();" ${loading ? 'disabled' : ''} class="w-full px-3 py-2 border ${registerForm.errors?.password ? 'border-red-500' : 'border-gray-300'} rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />`;
            if (registerForm.errors?.password) html += `<p class="mt-1 text-sm text-red-600 error">${registerForm.errors.password}</p>`;
            html += '</div>';
            html += `<div class="mb-6"><label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>`;
            html += `<input type="password" value="${registerForm.confirmPassword}" oninput="STR.dispatchAction(tree,{type:'SET_PROP',targetId:'register-form',payload:{key:'confirmPassword',value:this.value}});render();" ${loading ? 'disabled' : ''} class="w-full px-3 py-2 border ${registerForm.errors?.confirmPassword ? 'border-red-500' : 'border-gray-300'} rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />`;
            if (registerForm.errors?.confirmPassword) html += `<p class="mt-1 text-sm text-red-600 error">${registerForm.errors.confirmPassword}</p>`;
            html += '</div>';
            html += `<button type="submit" ${loading ? 'disabled' : ''} class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 font-medium">${loading ? 'Creating account...' : 'Register'}</button>`;
            html += '<p class="mt-4 text-center text-sm text-gray-500">Already have an account? <button type="button" onclick="switchTab(\'login\')" class="text-blue-600 hover:underline">Login</button></p>';
            html += '</form>';
        }

        html += '</div></div>';
        appRoot.innerHTML = html;

        // Restore cursor position in active input
        const activeInput = document.activeElement;
        if (activeInput && activeInput.tagName === 'INPUT') {
            const id = activeInput.getAttribute('data-str-input');
            if (id) {
                const el = document.querySelector(`[data-str-input="${id}"]`);
                if (el) el.focus();
            }
        }
    }

    // === SIGNAL SUBSCRIPTIONS ===
    STR.subscribeSignal(tree, 'auth-page', (signal) => {
        if (signal.payload?.key === 'toast' && signal.payload.value?.message) {
            setTimeout(() => {
                STR.dispatchAction(tree, { type: 'SET_PROP', targetId: 'auth-page', payload: { key: 'toast', value: { message: '', type: '' } } });
                render();
            }, 3000);
        }
    }, 'SET_PROP');

    // === INIT ===
    render();
    </script>
</body>
</html>
