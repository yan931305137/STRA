<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="stra-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="45%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="stra-signal" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f0a500" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0a500" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00b894" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Signal pulse line -->
  <line x1="8" y1="32" x2="272" y2="32" stroke="url(#stra-signal)" stroke-width="0.5" opacity="0.4"/>
  <!-- S -->
  <path d="M18 18 C18 13, 24 10, 32 12 C36 13, 38 16, 36 20 C34 24, 20 22, 18 28 C16 34, 22 38, 30 36 C34 35, 36 32, 34 28" stroke="url(#stra-gradient)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- T -->
  <line x1="50" y1="12" x2="72" y2="12" stroke="url(#stra-gradient)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="61" y1="12" x2="61" y2="38" stroke="url(#stra-gradient)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- R -->
  <path d="M82 38 L82 12 L96 12 C104 12, 106 20, 98 24 L106 38" stroke="url(#stra-gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M82 24 L96 24 C102 24, 102 18, 96 16" stroke="url(#stra-gradient)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- A -->
  <path d="M118 38 L128 12 L138 38" stroke="url(#stra-gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="121" y1="30" x2="135" y2="30" stroke="url(#stra-gradient)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Signal nodes -->
  <circle cx="8" cy="32" r="1.5" fill="#6366f1" opacity="0.8"/>
  <circle cx="272" cy="32" r="1.5" fill="#00b894" opacity="0.8"/>
  <circle cx="140" cy="32" r="1" fill="#f0a500" opacity="0.6"/>
</svg>
